<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#11111b">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
      /* The game fills the browser window (not the OS fullscreen API) and follows every resize. */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #11111b; }
      #unity-canvas {
        position: fixed; inset: 0;
        width: 100vw; height: 100vh; height: 100dvh; /* dvh: ignore mobile URL-bar jumps */
        display: block; outline: none; background: #11111b;
        touch-action: none; -webkit-tap-highlight-color: transparent;
      }
      /* Splash: game icon above the progress bar, centered while the build downloads. */
      #splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 28px; pointer-events: none;
      }
      #splash-logo { width: min(40vw, 40vh, 200px); height: auto; }
      #loading {
        width: min(60vw, 320px); height: 6px; border-radius: 3px; background: #1d1e2d; overflow: hidden;
      }
      #loading-fill { width: 0; height: 100%; background: #ffc72c; transition: width .15s; }
      #warning {
        position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 10;
        display: none; max-width: 90vw; font: 14px system-ui, sans-serif; color: #000;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="splash">
      <img id="splash-logo" src="logo.png" alt="">
      <div id="loading"><div id="loading-fill"></div></div>
    </div>
    <div id="warning"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var warning = document.querySelector("#warning");

      function unityShowBanner(msg, type) {
        var div = document.createElement("div");
        div.textContent = msg;
        div.style.padding = "10px";
        div.style.background = type == "error" ? "#ff5c5c" : "#ffc72c";
        warning.appendChild(div);
        warning.style.display = "block";
        if (type != "error") setTimeout(function () {
          warning.removeChild(div);
          if (!warning.children.length) warning.style.display = "none";
        }, 5000);
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };
      // Render at native sharpness, but cap at 2x so high-DPI phones don't burn GPU/battery.
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#loading-fill").style.width = 100 * progress + "%";
        }).then(function () {
          document.querySelector("#splash").style.display = "none";
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
